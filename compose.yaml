services:
  mongodb:
    image: mongo:7.0
    container_name: sensor_log_mongodb
    ports:
      - "27017:27017"
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_PASSWORD
      MONGO_INITDB_DATABASE: sensor_log
    command: mongod --auth
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 })\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - sensor_log_network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sensor_log_mosquitto
    hostname: $MQTT_HOST
    ports:
      - "1883:1883"
      - "8883:8883"
    env_file: .env
    volumes:
      - ./certs/public:/certs/public:ro
      - ./certs/ca/mqtt-client-ca.crt:/certs/ca/mqtt-client-ca.crt:ro
      - ./certs/public/admin.crt:/certs/public/admin.crt:ro
      - ./certs/private/admin.key:/certs/private/admin.key:ro
      - ./certs/private/server.key:/certs/private/server.key:ro
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 8883 --cafile /etc/ssl/certs/ca-certificates.crt --cert /certs/public/admin.crt --key /certs/private/admin.key --insecure -t healthcheck -m ok -q 0"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - sensor_log_network

  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    command: vault server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
    - vault_data:/vault/data
    - ./vault/config:/vault/config
    - ./certs/public/vault-server.crt:/vault/tls/vault-server.crt:ro
    - ./certs/private/vault-server.key:/vault/tls/vault-server.key:ro
    - ./certs/ca/vault-ca.crt:/vault/tls/ca.crt:ro
    - ./certs/bundles/truststore.p12:/vault/tls/truststore.p12:ro
    - ./vault/policies:/vault/policies:ro
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_CACERT: ${VAULT_CACERT}
    networks:
      - sensor_log_network

  spring_boot_app:
    build:
      context: .
    env_file: .env
    environment:
      SPRING_DATA_MONGODB_URI: $MONGO_URI
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "true"
      SPRING_CLOUD_VAULT_AUTHENTICATION: APPROLE
      SPRING_CLOUD_VAULT_APP_ROLE_ROLE_ID: ${VAULT_ROLE_ID}
      SPRING_CLOUD_VAULT_APP_ROLE_SECRET_ID: ${VAULT_SECRET_ID}
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
    - ./certs/bundles/truststore.p12:/vault/tls/truststore.p12:ro
    - ./certs/bundles/admin.p12:/certs/bundles/admin.p12:ro
    networks:
      - sensor_log_network
    restart: no
volumes:
  mongodb_data:
  mosquitto_data:
  mosquitto_logs:
  vault_data:

networks:
  sensor_log_network:
    driver: bridge
