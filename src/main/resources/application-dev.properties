spring.application.name=sensor_log
spring.mongodb.database=sensor_log
spring.mongodb.uri=${MONGO_URI}
mqtt.host=${MQTT_HOST}
mqtt.port=${MQTT_PORT}
mqtt.client-id=${MQTT_CLIENT_ID}
mqtt.ssl-enabled=true
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
sslCertificateFile=${MQTT_sslCertificateFile}
logging.level.com.server.sensor_log.mqtt=DEBUG
logging.level.org.mongodb.driver.client=ERROR
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.docker.compose.enabled=false
org.gradle.configuration-cache=true

# VAULT
spring.config.import=vault://
spring.cloud.vault.uri=https://vault:8200
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.ssl.trust-store=file:/certs/docker-truststore.p12
spring.cloud.vault.ssl.trust-store-password=${VAULT_TRUSTSTORE_PASSWORD}
spring.cloud.vault.ssl.trust-store-type=PKCS12
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=spring-app

#VAULT DEV SSL
spring.cloud.vault.ssl.trust-store=file:/certs/docker-truststore.p12
spring.cloud.vault.ssl.trust-store-password=${VAULT_TRUSTSTORE_PASSWORD}
spring.cloud.vault.ssl.trust-store-type=PKCS12